name: Discovery server tests
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/discovery-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest server.test_stream_discovery -v
      - run: python -c "from server.main import app; assert any(r.path == '/api/v2/streams' for r in app.routes)"
