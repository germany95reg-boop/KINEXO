name: Build KINEXO APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate search server
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server
          cd server
          python -c "from fastapi.testclient import TestClient; from main import app; c=TestClient(app); assert c.get('/health').json()['status']=='ok'; assert c.get('/search',params={'q':'a'}).status_code==422"
      - name: Test search API Docker image
        run: |
          docker build -t kinexo-search:test server
          docker run -d --name kinexo-api -p 127.0.0.1:8000:8000 kinexo-search:test
          trap 'docker logs kinexo-api; docker rm -f kinexo-api' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        env:
          SEARCH_API: ${{ vars.KINEXO_SEARCH_API }}
        run: gradle :app:assembleDebug "-PkinexoSearchApi=$SEARCH_API"
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk KINEXO-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view alpha-test >/dev/null 2>&1 || gh release create alpha-test --title "KINEXO Alpha Test" --prerelease --notes "Debug APK for testing"
          gh release upload alpha-test KINEXO-debug.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: KINEXO-v0.5.0
          path: app/build/outputs/apk/debug/app-debug.apk
